# vim:fileencoding=utf-8:foldmethod=marker
# Personal settings reviewed against kitty 0.49.1 (2026-09-29).
# Unspecified options use the defaults of the installed kitty version.
# Reference: https://sw.kovidgoyal.net/kitty/conf/
# Actions: https://sw.kovidgoyal.net/kitty/actions/
# Reload manually with Ctrl+Shift+F5; newer kitty also auto-reloads by default.

# Fonts {{{
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
# }}}

# Layout and appearance {{{
enabled_layouts splits:split_axis=horizontal,stack
background_opacity 0.95

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 1
tab_powerline_style angled
tab_title_template "{fmt.fg.red}[{layout_name.upper()}] {fmt.fg.cyan}[{index}]{fmt.fg.tab} {title}"
# }}}

# macOS {{{
# Use both Option keys as Alt (the explicit spelling of the legacy "yes").
# Restart kitty after changing this option.
macos_option_as_alt both
# }}}

# Keyboard shortcuts {{{
# In a sequence such as ctrl+a>_, press Ctrl+A, release, then type _.
# Built-in shortcuts remain available alongside these custom mappings.

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map ctrl+a>_ launch --location=hsplit --cwd=current

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map ctrl+a>| launch --location=vsplit --cwd=current

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split --cwd=current

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f7 layout_action rotate

# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+alt+up layout_action move_to_screen_edge top
map ctrl+shift+alt+left layout_action move_to_screen_edge left
map ctrl+shift+alt+right layout_action move_to_screen_edge right
map ctrl+shift+alt+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+a>left neighboring_window left
map ctrl+a>right neighboring_window right
map ctrl+a>up neighboring_window up
map ctrl+a>down neighboring_window down

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
map ctrl+. layout_action bias 80

map ctrl+a>q focus_visible_window
map ctrl+a>x close_window_with_confirmation

map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>c new_tab
map ctrl+a>r set_tab_title

map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

map ctrl+a>z toggle_layout stack
# }}}
